name: the_messenger
description: Cursus — Cartas de Roma
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.4.10

  # Local storage
  shared_preferences: ^2.2.2

  # Navigation
  go_router: ^13.2.0

  # Animations
  flutter_animate: ^4.5.0

  # Fonts

  # Utils
  intl: ^0.19.0
  uuid: ^4.3.3
  flutter_local_notifications: ^22.2.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0

  # Audio SFX
  audioplayers: ^6.1.0

  # Monetization
  in_app_purchase: ^3.2.0
  firebase_core: ^4.15.0
  firebase_analytics: ^12.6.0
  firebase_crashlytics: ^5.4.0
  firebase_remote_config: ^6.7.0
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.1.0
  google_mobile_ads: ^9.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/art/events/
    - assets/art/story/
    - assets/art/npcs/
    - assets/art/endings/
    - assets/art/scenes/
    - assets/fonts/OFL-Marcellus.txt
    - assets/fonts/OFL-Figtree.txt
    - assets/fonts/OFL-Literata.txt
  # Fuentes empaquetadas (OFL): el juego no depende de la red para su tipografía.
  fonts:
    - family: Marcellus
      fonts:
        - asset: assets/fonts/Marcellus-Regular.ttf
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-Regular.ttf
        - asset: assets/fonts/Figtree-Medium.ttf
          weight: 500
        - asset: assets/fonts/Figtree-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Figtree-Bold.ttf
          weight: 700
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata-Regular.ttf
        - asset: assets/fonts/Literata-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Literata-Italic.ttf
          style: italic

# Ícono y launch screen: salen de BrandSealPainter (tool/gen_icon_test.dart).
flutter_launcher_icons:
  image_path: assets/icon/icon.png
  ios: true
  remove_alpha_ios: true
  android: true
  adaptive_icon_background: "#F2E8D5"
  adaptive_icon_foreground: assets/icon/icon_foreground.png

flutter_native_splash:
  color: "#F2E8D5"
  image: assets/icon/splash_seal.png
  android_12:
    color: "#F2E8D5"
    image: assets/icon/splash_seal.png
